<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparation Dashboard — Demo</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1d2939;background:#f5f6fa}body{max-width:850px;margin:0 auto;padding:24px}header{margin-bottom:24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#667085}h1{margin:8px 0}p{color:#667085}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #172b4d0a}.track{height:14px;background:#e9edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:#4d7c83;width:0;transition:width .25s}section h2{font-size:17px;margin-bottom:12px}label{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid #edf0f3;cursor:pointer}input{width:20px;height:20px;accent-color:#4d7c83}label.done span{text-decoration:line-through;color:#98a2b3}small{color:#667085}button{padding:10px 16px;border:1px solid #cbd5df;background:white;border-radius:8px;cursor:pointer}</style></head>
<body><header><div class="eyebrow">GitHub software demonstration · sample data only</div><h1>Preparation Dashboard</h1><p>A working checklist. This demonstration is not connected to Asana or your real documents.</p></header>
<div class="panel"><strong id="status">0 of 0 complete</strong><p id="percent">0% complete</p><div class="track"><div class="fill" id="bar"></div></div></div><main id="app"></main><div class="panel"><button id="reset">Reset demo checklist</button><p><small>Selections are stored in this browser only. They are not synced to GitHub, Asana, or any other service.</small></p></div>
<script>
const groups={"Documents":["Review internal documents","Prepare print copies","Check external handover documents"],"Administration":["Confirm appointments","Review Centrelink requirements","Check contact details"],"Practical preparation":["Check packing list","Review home preparation","Confirm pet-care arrangements"]};
const key="rehab-dashboard-demo-v1";const tasks=Object.entries(groups).flatMap(([group,items])=>items.map((name)=>({id:group+":"+name,group,name})));
let checked={};try{checked=JSON.parse(localStorage.getItem(key)||"{}")}catch{}
function render(){const app=document.getElementById("app");app.replaceChildren();for(const [group] of Object.entries(groups)){const section=document.createElement("section");section.className="panel";const title=document.createElement("h2");title.textContent=group;section.append(title);for(const task of tasks.filter(t=>t.group===group)){const label=document.createElement("label");if(checked[task.id])label.className="done";const input=document.createElement("input");input.type="checkbox";input.checked=!!checked[task.id];input.addEventListener("change",()=>{checked[task.id]=input.checked;localStorage.setItem(key,JSON.stringify(checked));render()});const span=document.createElement("span");span.textContent=task.name;label.append(input,span);section.append(label)}app.append(section)}const count=tasks.filter(t=>checked[t.id]).length;const pct=Math.round(count/tasks.length*100);document.getElementById("status").textContent=count+" of "+tasks.length+" complete";document.getElementById("percent").textContent=pct+"% complete";document.getElementById("bar").style.width=pct+"%"}
document.getElementById("reset").addEventListener("click",()=>{checked={};localStorage.removeItem(key);render()});render();
</script></body></html>
